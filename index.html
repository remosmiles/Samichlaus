<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weihnachts-Casting: Samichlaus Reel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Weihnachtliche Farben & Animationen */
        body {
            background-color: #064e3b; /* Tiefes Tannengrün */
            background-image: radial-gradient(circle, #064e3b 0%, #022c22 100%);
            overflow-x: hidden;
        }

        .xmas-red { background-color: #991b1b; }
        .xmas-text-red { color: #991b1b; }
        .xmas-gold { color: #facc15; }
        .xmas-border-gold { border-color: #facc15; }

        /* Schneeflocken & Lebkuchen Animation */
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .falling-item {
            position: fixed;
            top: -10vh;
            z-index: 0;
            pointer-events: none; /* Verhindert, dass die Animation Klicks blockiert */
            animation: fall linear infinite;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
        }

        /* Glüh-Effekt für den Titel */
        .text-glow {
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans relative">

    <!-- Container für den Inhalt (z-10 damit es über dem Schnee liegt) -->
    <div class="relative z-10 max-w-2xl mx-auto space-y-8 mt-4 md:mt-10">
        
        <!-- Main Card: Header & Formular -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border-2 xmas-border-gold">
            
            <!-- Weihnachtlicher Header -->
            <div class="xmas-red text-white p-8 text-center border-b-4 xmas-border-gold relative overflow-hidden">
                <!-- Dekorative Kreise im Hintergrund -->
                <div class="absolute top-0 left-0 w-32 h-32 bg-red-900 rounded-full mix-blend-multiply filter blur-xl opacity-50 transform -translate-x-1/2 -translate-y-1/2"></div>
                <div class="absolute bottom-0 right-0 w-32 h-32 bg-red-900 rounded-full mix-blend-multiply filter blur-xl opacity-50 transform translate-x-1/2 translate-y-1/2"></div>
                
                <h1 class="text-4xl md:text-5xl font-extrabold mb-3 font-serif text-glow xmas-gold">Samichlaus Casting</h1>
                <p class="text-md font-medium text-red-100 tracking-wide uppercase">Kantonspolizei Uri - Social Media</p>
            </div>
            
            <!-- Rollen Übersicht -->
            <div class="p-6 bg-red-50 border-b border-red-100 text-center">
                <h2 class="font-bold text-lg xmas-text-red mb-3 flex items-center justify-center gap-2">
                    <span>🎄</span> Wir suchen für das Reel: <span>🎄</span>
                </h2>
                <div class="flex flex-wrap justify-center gap-4 text-sm">
                    <span class="bg-white px-4 py-2 rounded-full shadow-sm border border-red-200 font-semibold xmas-text-red">3x Sicherheitsassistent/in</span>
                    <span class="bg-white px-4 py-2 rounded-full shadow-sm border border-red-200 font-semibold xmas-text-red">2x Schmutzli</span>
                </div>
                <p class="text-gray-500 text-xs mt-3 italic">🎅 Samichlaus ist bereits besetzt (Damian Walker)</p>
            </div>

            <!-- Formular -->
            <div class="p-8">
                <form id="castingForm" class="space-y-5">
                    <div>
                        <label for="name" class="block text-sm font-bold text-gray-700 mb-2">Vorname & Name</label>
                        <input type="text" id="name" required placeholder="Gibli & Kari..." class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-red-800 focus:ring-1 focus:ring-red-800 transition-colors bg-gray-50">
                    </div>
                    
                    <div>
                        <label for="role" class="block text-sm font-bold text-gray-700 mb-2">Wunschrolle</label>
                        <select id="role" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-red-800 focus:ring-1 focus:ring-red-800 transition-colors bg-gray-50 appearance-none cursor-pointer">
                            <option value="" disabled selected>Bitte Rolle auswählen...</option>
                            <option value="Sicherheitsassistent">👮 Sicherheitsassistent/in</option>
                            <option value="Schmutzli">🧹 Schmutzli</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full xmas-red text-white font-bold text-lg py-4 px-4 rounded-xl hover:bg-red-900 transform hover:scale-[1.02] transition-all duration-200 shadow-lg flex justify-center items-center gap-2 border border-red-950">
                        <span>Jetzt eintragen</span>
                        <span>✨</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Live-Liste Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden p-8 border-2 border-green-800">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-green-900 font-serif">Die Crew (Live)</h2>
                <div class="h-1 w-24 bg-green-800 mx-auto mt-2 rounded-full"></div>
            </div>
            
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Spalte: Sicherheitsassistenten -->
                <div class="bg-green-50 rounded-xl p-5 border border-green-100 shadow-inner">
                    <h3 class="font-bold text-green-900 border-b-2 border-green-200 pb-2 mb-4 flex justify-between items-center">
                        <span>👮 SiAss</span>
                        <span class="bg-green-800 text-white text-xs px-2 py-1 rounded-full"><span id="count-sicher">0</span> / 3</span>
                    </h3>
                    <ul id="list-sicher" class="space-y-3 min-h-[3rem]">
                        <li class="text-sm italic text-gray-400 text-center py-2">Wartet auf Einträge...</li>
                    </ul>
                </div>
                
                <!-- Spalte: Schmutzli -->
                <div class="bg-red-50 rounded-xl p-5 border border-red-100 shadow-inner">
                    <h3 class="font-bold xmas-text-red border-b-2 border-red-200 pb-2 mb-4 flex justify-between items-center">
                        <span>🧹 Schmutzli</span>
                        <span class="xmas-red text-white text-xs px-2 py-1 rounded-full"><span id="count-schmutzli">0</span> / 2</span>
                    </h3>
                    <ul id="list-schmutzli" class="space-y-3 min-h-[3rem]">
                        <li class="text-sm italic text-gray-400 text-center py-2">Wartet auf Einträge...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Schnee & Lebkuchen Generator -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const symbols = ['❄️', '❄️', '🍪', '❄️', '⭐', '❄️']; // Mehr Schnee als Kekse
            const container = document.body;
            const amount = window.innerWidth < 768 ? 20 : 45; // Weniger auf Handys

            for (let i = 0; i < amount; i++) {
                let el = document.createElement('div');
                el.className = 'falling-item';
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 5 + 5) + 's'; // 5 bis 10 Sekunden
                el.style.animationDelay = (Math.random() * 5) + 's';
                el.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
                el.style.opacity = (Math.random() * 0.6 + 0.4).toString();
                container.appendChild(el);
            }
        });
    </script>

    <!-- Firebase SDK & Logik -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Deine exakte Firebase Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyB06LAgecdwUdTjWiZwLDClqO46sqUggsA",
            authDomain: "samichlaus-reel.firebaseapp.com",
            projectId: "samichlaus-reel",
            storageBucket: "samichlaus-reel.firebasestorage.app",
            messagingSenderId: "419231849593",
            appId: "1:419231849593:web:3fc79233ef910dc8ea08a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const signupsRef = collection(db, "reel_signups");

        // Formular absenden
        document.getElementById('castingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = "<span>Speichert... 🎅</span>";

            try {
                await addDoc(signupsRef, {
                    name: name,
                    role: role,
                    timestamp: serverTimestamp()
                });
                e.target.reset();
            } catch (error) {
                console.error("Fehler beim Speichern: ", error);
                alert("Ho Ho Ho! Da lief was schief. Bitte prüfe die Datenbank-Regeln (Testmodus).");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Live-Daten auslesen
        const q = query(signupsRef, orderBy("timestamp", "asc"));
        
        onSnapshot(q, (snapshot) => {
            const listSicher = document.getElementById('list-sicher');
            const listSchmutzli = document.getElementById('list-schmutzli');
            
            listSicher.innerHTML = '';
            listSchmutzli.innerHTML = '';
            
            let countSicher = 0;
            let countSchmutzli = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                // Styling für den einzelnen Listeneintrag
                li.className = "bg-white px-4 py-3 rounded-lg border border-gray-100 shadow-sm flex justify-between items-center";
                li.innerHTML = `<span class="font-bold text-gray-800">${data.name}</span> <span class="text-xs text-gray-400 font-medium bg-gray-50 px-2 py-1 rounded">${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString('de-CH', {hour: '2-digit', minute:'2-digit'}) : 'Neu'}</span>`;
                
                if (data.role === 'Sicherheitsassistent') {
                    listSicher.appendChild(li);
                    countSicher++;
                } else if (data.role === 'Schmutzli') {
                    listSchmutzli.appendChild(li);
                    countSchmutzli++;
                }
            });

            document.getElementById('count-sicher').innerText = countSicher;
            document.getElementById('count-schmutzli').innerText = countSchmutzli;

            if(countSicher === 0) listSicher.innerHTML = '<li class="text-sm italic text-gray-400 text-center py-2">Noch keine Einträge</li>';
            if(countSchmutzli === 0) listSchmutzli.innerHTML = '<li class="text-sm italic text-gray-400 text-center py-2">Noch keine Einträge</li>';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting: Samichlaus Reel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .kapo-blue { background-color: #003366; }
        .kapo-text { color: #003366; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="kapo-blue text-white p-6 text-center">
                <h1 class="text-3xl font-bold mb-2">Samichlaus Reel Casting</h1>
                <p class="text-sm opacity-90">Kantonspolizei Uri - Social Media Team</p>
            </div>
            
            <div class="p-6 bg-blue-50 border-b border-blue-100">
                <h2 class="font-semibold text-lg mb-2">Gesuchte Rollen:</h2>
                <ul class="list-disc list-inside text-gray-700 space-y-1">
                    <li><strong>3x Sicherheitsassistenten</strong></li>
                    <li><strong>2x Schmutzli</strong></li>
                    <li class="text-gray-500"><em>Samichlaus: Bereits besetzt (Damian Walker)</em></li>
                </ul>
            </div>

            <!-- Formular -->
            <div class="p-6">
                <form id="castingForm" class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name / Vorname</label>
                        <input type="text" id="name" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div>
                        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Wunschrolle</label>
                        <select id="role" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Bitte wählen...</option>
                            <option value="Sicherheitsassistent">Sicherheitsassistent/in</option>
                            <option value="Schmutzli">Schmutzli</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full kapo-blue text-white font-bold py-3 px-4 rounded-md hover:bg-blue-800 transition duration-200">
                        Für Reel eintragen
                    </button>
                </form>
            </div>
        </div>

        <!-- Live-Liste -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6">
            <h2 class="text-xl font-bold kapo-text mb-4">Bereits eingetragen (Live):</h2>
            
            <div class="space-y-6">
                <div>
                    <h3 class="font-semibold text-gray-700 border-b pb-1 mb-2">Sicherheitsassistenten (<span id="count-sicher">0</span>/3)</h3>
                    <ul id="list-sicher" class="space-y-2 text-gray-600 min-h-[2rem]">
                        <li class="text-sm italic text-gray-400">Lädt...</li>
                    </ul>
                </div>
                
                <div>
                    <h3 class="font-semibold text-gray-700 border-b pb-1 mb-2">Schmutzli (<span id="count-schmutzli">0</span>/2)</h3>
                    <ul id="list-schmutzli" class="space-y-2 text-gray-600 min-h-[2rem]">
                        <li class="text-sm italic text-gray-400">Lädt...</li>
                    </ul>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ERSETZE DIESEN BLOCK MIT DEINEN FIREBASE CONFIG DATEN
        const firebaseConfig = {
            apiKey: "DEIN_API_KEY",
            authDomain: "DEIN_PROJEKT.firebaseapp.com",
            projectId: "DEIN_PROJEKT_ID",
            storageBucket: "DEIN_PROJEKT.appspot.com",
            messagingSenderId: "DEINE_SENDER_ID",
            appId: "DEINE_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const signupsRef = collection(db, "reel_signups");

        // Formular absenden (Daten in Firebase schreiben)
        document.getElementById('castingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const btn = e.target.querySelector('button');
            
            btn.disabled = true;
            btn.innerText = "Wird gespeichert...";

            try {
                await addDoc(signupsRef, {
                    name: name,
                    role: role,
                    timestamp: serverTimestamp()
                });
                e.target.reset();
            } catch (error) {
                console.error("Fehler beim Speichern: ", error);
                alert("Fehler beim Speichern. Bitte überprüfe deine Datenbank-Regeln.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Für Reel eintragen";
            }
        });

        // Live-Daten auslesen und anzeigen (Echtzeit)
        const q = query(signupsRef, orderBy("timestamp", "asc"));
        
        onSnapshot(q, (snapshot) => {
            const listSicher = document.getElementById('list-sicher');
            const listSchmutzli = document.getElementById('list-schmutzli');
            
            listSicher.innerHTML = '';
            listSchmutzli.innerHTML = '';
            
            let countSicher = 0;
            let countSchmutzli = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.className = "bg-gray-50 px-3 py-2 rounded border border-gray-100 flex justify-between items-center";
                li.innerHTML = `<span class="font-medium">${data.name}</span> <span class="text-xs text-gray-500">${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString('de-CH', {hour: '2-digit', minute:'2-digit'}) : 'Gerade eben'}</span>`;
                
                if (data.role === 'Sicherheitsassistent') {
                    listSicher.appendChild(li);
                    countSicher++;
                } else if (data.role === 'Schmutzli') {
                    listSchmutzli.appendChild(li);
                    countSchmutzli++;
                }
            });

            document.getElementById('count-sicher').innerText = countSicher;
            document.getElementById('count-schmutzli').innerText = countSchmutzli;

            if(countSicher === 0) listSicher.innerHTML = '<li class="text-sm italic text-gray-400">Noch keine Einträge</li>';
            if(countSchmutzli === 0) listSchmutzli.innerHTML = '<li class="text-sm italic text-gray-400">Noch keine Einträge</li>';
        });
    </script>
</body>
</html>
